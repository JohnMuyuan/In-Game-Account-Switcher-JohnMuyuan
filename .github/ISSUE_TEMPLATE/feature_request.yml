name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感谢你的建议！请描述你希望看到的改进。
  - type: textarea
    id: description
    attributes:
      label: 建议内容
      description: 你希望添加或改进什么功能？它能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你目前是如何解决这个问题的？
    validations:
      required: false
